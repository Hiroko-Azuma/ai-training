<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">02.環境確認.md のプレビュー表示手順</title>
  <desc id="desc">VS Code上でMarkdownファイルを開き、Ctrl+Shift+Vでプレビュー表示する流れを示す図</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)"/>
  <text x="70" y="74" font-family="'Yu Gothic UI','Meiryo',sans-serif" font-size="34" font-weight="700" fill="#0f172a">VS Code上で 02.環境確認.md をプレビュー表示</text>
  <text x="70" y="112" font-family="'Yu Gothic UI','Meiryo',sans-serif" font-size="20" fill="#334155">このあと以降の手順は、Markdownのプレビューを見ながら進める想定です</text>

  <g filter="url(#shadow)">
    <rect x="60" y="150" width="1080" height="500" rx="24" fill="url(#panel)"/>
  </g>

  <rect x="60" y="150" width="1080" height="54" rx="24" fill="#111827"/>
  <circle cx="96" cy="177" r="8" fill="#ef4444"/>
  <circle cx="122" cy="177" r="8" fill="#f59e0b"/>
  <circle cx="148" cy="177" r="8" fill="#22c55e"/>
  <text x="540" y="184" text-anchor="middle" font-family="'Yu Gothic UI','Meiryo',sans-serif" font-size="18" fill="#cbd5e1">VS Code</text>

  <rect x="84" y="224" width="250" height="390" rx="16" fill="#0b1220" stroke="#334155"/>
  <text x="110" y="258" font-family="'Yu Gothic UI','Meiryo',sans-serif" font-size="18" font-weight="700" fill="#e2e8f0">エクスプローラー</text>
  <text x="110" y="300" font-family="'Yu Gothic UI','Meiryo',sans-serif" font-size="17" fill="#93c5fd">Doc研修用</text>
  <text x="126" y="336" font-family="'Yu Gothic UI','Meiryo',sans-serif" font-size="17" fill="#cbd5e1">03.資材説明.md</text>
  <rect x="116" y="350" width="180" height="38" rx="8" fill="#1d4ed8" opacity="0.28" stroke="#60a5fa" stroke-width="2"/>
  <text x="126" y="375" font-family="'Yu Gothic UI','Meiryo',sans-serif" font-size="17" font-weight="700" fill="#ffffff">02.環境確認.md</text>
  <text x="126" y="414" font-family="'Yu Gothic UI','Meiryo',sans-serif" font-size="17" fill="#cbd5e1">99.トレサポ.md</text>

  <rect x="370" y="224" width="734" height="390" rx="18" fill="#f8fafc"/>
  <rect x="370" y="224" width="734" height="46" rx="18" fill="#e2e8f0"/>
  <text x="398" y="253" font-family="'Yu Gothic UI','Meiryo',sans-serif" font-size="17" font-weight="700" fill="#334155">02.環境確認.md</text>
  <text x="398" y="309" font-family="'Yu Gothic UI','Meiryo',sans-serif" font-size="28" font-weight="700" fill="#0f172a">02. 環境確認 9:30-10:00</text>
  <text x="398" y="352" font-family="'Yu Gothic UI','Meiryo',sans-serif" font-size="20" fill="#475569">1. 実行環境の説明</text>
  <text x="398" y="388" font-family="'Yu Gothic UI','Meiryo',sans-serif" font-size="20" fill="#475569">2. GithubCodespacesに接続</text>
  <text x="398" y="424" font-family="'Yu Gothic UI','Meiryo',sans-serif" font-size="20" fill="#475569">3. VS Codeの起動</text>
  <text x="398" y="460" font-family="'Yu Gothic UI','Meiryo',sans-serif" font-size="20" fill="#475569">4. VS Codeへ資材配置</text>
  <text x="398" y="496" font-family="'Yu Gothic UI','Meiryo',sans-serif" font-size="20" fill="#94a3b8">...</text>

  <rect x="756" y="514" width="292" height="62" rx="14" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="902" y="540" text-anchor="middle" font-family="'Yu Gothic UI','Meiryo',sans-serif" font-size="18" font-weight="700" fill="#1e3a8a">ショートカットでプレビュー表示</text>
  <text x="902" y="566" text-anchor="middle" font-family="Consolas, monospace" font-size="22" font-weight="700" fill="#1d4ed8">Ctrl + Shift + V</text>

  <path d="M300 368 C 360 368, 390 368, 430 340" fill="none" stroke="#dc2626" stroke-width="6" marker-end="url(#arrow)"/>
  <path d="M900 506 C 900 470, 900 430, 900 398" fill="none" stroke="#dc2626" stroke-width="6" marker-end="url(#arrow)"/>

  <g>
    <circle cx="270" cy="338" r="24" fill="#dc2626"/>
    <text x="270" y="347" text-anchor="middle" font-family="'Yu Gothic UI','Meiryo',sans-serif" font-size="22" font-weight="700" fill="#ffffff">1</text>
    <rect x="208" y="278" width="184" height="44" rx="10" fill="#ffffff" opacity="0.96"/>
    <text x="300" y="307" text-anchor="middle" font-family="'Yu Gothic UI','Meiryo',sans-serif" font-size="18" font-weight="700" fill="#b91c1c">02.環境確認.md を開く</text>
  </g>

  <g>
    <circle cx="918" cy="610" r="24" fill="#dc2626"/>
    <text x="918" y="619" text-anchor="middle" font-family="'Yu Gothic UI','Meiryo',sans-serif" font-size="22" font-weight="700" fill="#ffffff">2</text>
    <rect x="704" y="626" width="426" height="42" rx="10" fill="#ffffff" opacity="0.96"/>
    <text x="917" y="653" text-anchor="middle" font-family="'Yu Gothic UI','Meiryo',sans-serif" font-size="18" font-weight="700" fill="#b91c1c">Ctrl + Shift + V でプレビューを表示</text>
  </g>
</svg>