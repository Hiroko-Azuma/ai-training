<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 400" font-family="Segoe UI, Meiryo, 'Yu Gothic UI', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- ==================== Git ==================== -->
  <text x="40" y="40" font-size="16" font-weight="bold" fill="#1f2937">■ Git</text>

  <rect x="40" y="55" width="755" height="175" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="56" y="78" font-size="13" fill="#475569">手元（まだ誰にも影響しない）</text>

  <!-- 作業ツリー -->
  <rect x="55" y="90" width="185" height="120" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="147" y="114" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2937">作業ツリー</text>
  <g font-size="11.5" fill="#1f2937">
    <rect x="70" y="124" width="155" height="21" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="80" y="139">A.java</text><text x="208" y="139" fill="#d97706" font-weight="bold">M</text>
    <rect x="70" y="149" width="155" height="21" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="80" y="164">B.java</text><text x="208" y="164" fill="#d97706" font-weight="bold">M</text>
    <rect x="70" y="174" width="155" height="21" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="80" y="189">メモ.txt</text><text x="208" y="189" fill="#d97706" font-weight="bold">M</text>
  </g>

  <line x1="243" y1="150" x2="317" y2="150" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="280" y="133" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f766e">ステージング</text>
  <text x="280" y="146" text-anchor="middle" font-size="11" fill="#0f766e">（選ぶ）</text>

  <!-- ステージ -->
  <rect x="320" y="90" width="185" height="120" rx="10" fill="#fef9c3" stroke="#eab308" stroke-width="2.5"/>
  <text x="412" y="114" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2937">ステージ</text>
  <g font-size="11.5" fill="#1f2937">
    <rect x="335" y="124" width="155" height="21" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="345" y="139">A.java</text>
    <rect x="335" y="149" width="155" height="21" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="345" y="164">B.java</text>
  </g>
  <text x="412" y="190" text-anchor="middle" font-size="11" fill="#94a3b8">メモ.txt は入れない</text>

  <line x1="508" y1="150" x2="582" y2="150" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="545" y="133" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f766e">コミット</text>
  <text x="545" y="146" text-anchor="middle" font-size="11" fill="#0f766e">（記録）</text>

  <!-- ローカルリポジトリ -->
  <rect x="585" y="90" width="195" height="120" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="682" y="114" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2937">ローカルリポジトリ</text>
  <g font-size="11.5" fill="#1f2937">
    <circle cx="612" cy="135" r="4.5" fill="#7c3aed"/><text x="626" y="139">コミット3 ← いま</text>
    <circle cx="612" cy="160" r="4.5" fill="#c4b5fd"/><text x="626" y="164" fill="#64748b">コミット2</text>
    <circle cx="612" cy="185" r="4.5" fill="#c4b5fd"/><text x="626" y="189" fill="#64748b">コミット1</text>
  </g>

  <line x1="798" y1="150" x2="872" y2="150" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="835" y="133" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f766e">プッシュ</text>
  <text x="835" y="146" text-anchor="middle" font-size="11" fill="#0f766e">（共有）</text>

  <!-- GitHub -->
  <rect x="875" y="90" width="195" height="120" rx="10" fill="#dcfce7" stroke="#10b981" stroke-width="2.5"/>
  <text x="972" y="114" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2937">GitHub（共有）</text>
  <g font-size="11.5" fill="#64748b">
    <circle cx="902" cy="135" r="4.5" fill="#10b981"/><text x="916" y="139" fill="#1f2937">コミット3</text>
    <circle cx="902" cy="160" r="4.5" fill="#a7f3d0"/><text x="916" y="164">コミット2</text>
    <circle cx="902" cy="185" r="4.5" fill="#a7f3d0"/><text x="916" y="189">コミット1</text>
  </g>

  <!-- ==================== SVN ==================== -->
  <text x="40" y="290" font-size="16" font-weight="bold" fill="#1f2937">■ SVN</text>

  <rect x="55" y="305" width="185" height="60" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2.5"/>
  <text x="147" y="342" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2937">作業コピー</text>

  <line x1="243" y1="335" x2="872" y2="335" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="557" y="322" text-anchor="middle" font-size="12" font-weight="bold" fill="#b45309">コミット（＝いきなり共有）</text>
  <text x="557" y="356" text-anchor="middle" font-size="11.5" fill="#94a3b8">ステージ／ローカルリポジトリに相当するものが無い</text>

  <rect x="875" y="305" width="195" height="60" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2.5"/>
  <text x="972" y="342" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2937">サーバ（共有）</text>
</svg>
