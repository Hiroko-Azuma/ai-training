<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>書籍編集確認 - 書籍管理システム</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
  <div th:replace="~{fragments/common :: header}"></div>

  <div class="container">
    <h2 class="page-title">書籍編集確認</h2>

    <div class="alert alert-info">以下の内容で更新します。よろしいですか?</div>
    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <div class="card">
      <dl class="confirm-table">
        <dt>タイトル</dt>
        <dd th:text="${bookEditForm.title}"></dd>
        <dt>著者</dt>
        <dd th:text="${bookEditForm.author}"></dd>
        <dt>出版社</dt>
        <dd th:text="${bookEditForm.publisher}"></dd>
        <dt>出版日</dt>
        <dd th:text="${bookEditForm.publishedDate}"></dd>
        <dt>ISBN</dt>
        <dd th:text="${bookEditForm.isbn}"></dd>
        <dt>カテゴリ</dt>
        <dd th:text="${categoryName}"></dd>
        <dt>価格</dt>
        <dd th:text="${#numbers.formatInteger(bookEditForm.price, 1, 'COMMA')} + '円'"></dd>
        <dt>概要</dt>
        <dd th:text="${bookEditForm.description}"></dd>
      </dl>

      <div class="btn-group">
        <form th:action="@{/book/edit/{id}/update(id=${bookEditForm.bookId})}" method="post" style="display:inline;">
          <button type="submit" class="btn btn-primary">更新</button>
        </form>
        <a class="btn btn-secondary" th:href="@{/book/edit/{id}(id=${bookEditForm.bookId})}">戻る</a>
      </div>
    </div>
  </div>

  <div th:replace="~{fragments/common :: footer}"></div>
</body>
</html>
