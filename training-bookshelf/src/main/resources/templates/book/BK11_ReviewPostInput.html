<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>レビュー投稿 - 書籍管理システム</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
  <div th:replace="~{fragments/common :: header}"></div>

  <div class="container">
    <h2 class="page-title">レビュー投稿</h2>

    <div class="card">
      <dl class="confirm-table">
        <dt>タイトル</dt>
        <dd th:text="${book.title}"></dd>
        <dt>著者</dt>
        <dd th:text="${book.author}"></dd>
      </dl>
    </div>

    <div class="card">
      <form th:action="@{/books/{id}/reviews/confirm(id=${book.bookId})}" th:object="${reviewForm}" method="post">
        <div class="form-group">
          <label class="required" for="reviewerName">レビュアー名</label>
          <input type="text" id="reviewerName" th:field="*{reviewerName}" maxlength="50"
                 th:classappend="${errors != null and errors.containsKey('reviewerName')} ? 'has-error'">
          <div class="error-message" th:if="${errors != null and errors.containsKey('reviewerName')}" th:text="${errors.get('reviewerName')}"></div>
        </div>
        <div class="form-group">
          <label class="required">評価</label>
          <div>
            <label th:each="value : ${#numbers.sequence(1, 5)}" style="margin-right:12px;">
              <input type="radio" th:field="*{rating}" th:value="${value}"> <span th:text="${value} + '★'"></span>
            </label>
          </div>
          <div class="error-message" th:if="${errors != null and errors.containsKey('rating')}" th:text="${errors.get('rating')}"></div>
        </div>
        <div class="form-group">
          <label for="comment">コメント</label>
          <textarea id="comment" th:field="*{comment}" maxlength="1000"
                    th:classappend="${errors != null and errors.containsKey('comment')} ? 'has-error'"></textarea>
          <div class="error-message" th:if="${errors != null and errors.containsKey('comment')}" th:text="${errors.get('comment')}"></div>
        </div>

        <div class="btn-group">
          <button type="submit" class="btn btn-primary">確認画面へ</button>
          <a class="btn btn-secondary" th:href="@{/books/{id}/reviews/cancel(id=${book.bookId})}">キャンセル</a>
        </div>
      </form>
    </div>
  </div>

  <div th:replace="~{fragments/common :: footer}"></div>
</body>
</html>
